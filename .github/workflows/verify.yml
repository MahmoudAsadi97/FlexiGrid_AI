name: Verify
on:
  push:
    branches: [main, 'upgrade/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package source for reproducibility
        run: git archive --format=zip HEAD -o FlexiGrid_AI-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: FlexiGrid_AI-source.zip
          retention-days: 7
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLEXIGRID_EMBEDDINGS: tfidf
      ELIA_USE_LIVE: 'false'
      FLEXIGRID_LLM_BASE_URL: 'http://127.0.0.1:9'
      FLEXIGRID_LLM_TIMEOUT: '5'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Backend regression tests
        working-directory: backend
        run: |
          timeout 180s python -u - <<'PYTEST'
          import faulthandler
          import unittest
          faulthandler.dump_traceback_later(45, repeat=True)
          unittest.main(module=None, argv=["unittest", "discover", "-s", "tests", "-v"])
          PYTEST
      - name: Reproducible planner benchmarks
        working-directory: backend
        run: python -m flexigrid.benchmark_planning --output evaluation/ci-planning.json
      - uses: actions/upload-artifact@v4
        with:
          name: planner-benchmarks
          path: backend/evaluation/ci-planning.json
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
